<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
  // Set light or dark before the page draws, so it never flashes the wrong colour.
  (function () { try { var a = JSON.parse(localStorage.getItem('mm_appearance')) || 'auto';
    var d = a === 'dark' || (a === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
    if (d) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#000000'); } catch (e) {} })();
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" aria-live="polite"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="print-sheet" aria-hidden="true"></div>

<script src="qr.js"></script>

</body>
